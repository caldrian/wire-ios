# GitHub Action: Cherry-pick from `release/cycle-X.Y` to next release branch or `develop`
#
# This action automates the process of cherry-picking merged PRs from release branches.
# It is triggered whenever a pull request is merged into any `release/*` branch.
#
# Target branch selection:
# - Gets all release branches and sorts them
# - Finds the position of the source branch in the sorted list
# - Selects the next branch in the sorted list, or `develop` if no next branch exists
# - If the source branch doesn't match `release/cycle-*` pattern, targets `develop`
#
# The action performs the following steps:
# 1. Checkout the merged PR.
# 2. Determine the target branch (next release branch if exists, otherwise `develop`).
# 3. If changes are made outside the specified submodule or no submodule is specified, the action proceeds.
# 4. If a submodule name is provided in the `SUBMODULE_NAME` environment variable:
#    a. The action creates a temporary branch.
#    b. Updates the submodule to its latest version from the target branch.
#    c. Commits the submodule updates.
# 5. Squashes the commit with the commit message of the merged PR (if a submodule was updated).
# 6. Cherry-picks the squashed (or original if no squashing occurred) commit to a new branch based on the target branch.
# 7. If any conflicts arise during the cherry-pick, they are committed.
# 8. The branch with the cherry-picked changes is pushed.
# 9. A new pull request is created against the target branch with the cherry-picked changes.
#

name: "Cherry-pick from release to next release or develop"

on:
  pull_request:
    branches:
      - release/*
    types:
      - closed

jobs:
  cherry-pick:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged == true

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
          token: ${{ secrets.SUBMODULE_PAT }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine target branch
        id: target-branch
        run: |
          python3 << 'EOF'
          import os
          import re
          import subprocess
          import sys

          BASE_BRANCH = "${{ github.event.pull_request.base.ref }}"
          
          # Check if base branch matches release/cycle-* pattern
          if not BASE_BRANCH.startswith("release/cycle-"):
              print(f"Base branch {BASE_BRANCH} doesn't match release/cycle-* pattern, using develop")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"target=develop\n")
              sys.exit(0)
          
          # Get all remote branches
          result = subprocess.run(
              ["git", "ls-remote", "--heads", "origin"],
              capture_output=True,
              text=True
          )
          
          # Extract branch names matching release/cycle-* pattern
          branches = []
          for line in result.stdout.strip().split('\n'):
              if line:
                  # Format: <hash> refs/heads/release/cycle-X.Y
                  parts = line.split()
                  if len(parts) >= 2:
                      branch = parts[1].replace('refs/heads/', '')
                      if branch.startswith('release/cycle-'):
                          branches.append(branch)
          
          if not branches:
              print(f"No release branches found, using develop")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"target=develop\n")
              sys.exit(0)
          
          # Sort branches by version number (extract X.Y and sort numerically)
          def version_key(branch):
              # Extract version from release/cycle-X.Y pattern
              match = re.search(r'release/cycle-(\d+)\.(\d+)', branch)
              if match:
                  return (int(match.group(1)), int(match.group(2)))
              # Fallback: sort lexicographically
              return (0, 0)
          
          branches.sort(key=version_key)
          
          print(f"Found {len(branches)} release branches:")
          for branch in branches:
              print(f"  - {branch}")
          
          # Find the position of the base branch
          try:
              index = branches.index(BASE_BRANCH)
              print(f"\nBase branch {BASE_BRANCH} found at position {index + 1} of {len(branches)}")
              
              # Get the next branch
              if index + 1 < len(branches):
                  next_branch = branches[index + 1]
                  print(f"Next release branch: {next_branch}")
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f"target={next_branch}\n")
              else:
                  print(f"No next release branch found, using develop")
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f"target=develop\n")
          except ValueError:
              print(f"Base branch {BASE_BRANCH} not found in release branches, using develop")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"target=develop\n")
          EOF

      - name: Cherry pick to target branch
        uses: wireapp/action-auto-cherry-pick@v1.0.2
        with:
          target-branch: ${{ steps.target-branch.outputs.target }}
          pr-labels: 'cherry-pick'
          pr-title-suffix: '🍒'
